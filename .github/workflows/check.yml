name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare locked media test components
        shell: pwsh
        run: ./scripts/bootstrap-runtime.ps1
      - shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { throw 'pnpm setup failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked install failed' }
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test update --features update-test-hooks
          if ($LASTEXITCODE -ne 0) { throw 'Update recovery tests failed' }
          node scripts/source-list.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source audit failed' }
          node tests/source-preparation.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Source preparation safety checks failed' }
          cargo check --locked --manifest-path src-tauri/Cargo.toml --bins --features desktop,custom-protocol
          if ($LASTEXITCODE -ne 0) { throw 'Desktop check failed' }
          node scripts/verify-distribution.cjs distribution-support --require-complete
          if ($LASTEXITCODE -ne 0) { throw 'Distribution material verification failed' }
          node scripts/generate-distribution-docs.cjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated distribution documents are stale' }
          python tests/release-consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Release consistency checks failed' }
